spring:
  application:
    name: marketplace
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
logging:
  pattern:
    correlation: "[%X{correlationId:-} %X{tenantId:-} %X{customerId:-} %X{distributorId:-}] "
