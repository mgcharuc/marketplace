spring:
  application:
    name: marketplace
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
marketplace:
  relay:
    scheduler:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    correlation: "[%X{correlationId:-} %X{tenantId:-} %X{customerId:-} %X{distributorId:-} %X{orderId:-}] "
